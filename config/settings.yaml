input:
  type: webcam
  webcam_device_index: 1
  video_file_path: ""
  rtsp_url: ""

models:
  yolo_path: yolo11n.pt

thresholds:
  detection_confidence: 0.5
  face_similarity: 0.5
  reid_similarity: 0.7

capture:
  directory: captures

notification:
  duplicate_suppression_seconds: 300

target_person:
  gender: female
  age: 7
  hair_length: short
  hair_color: black
  upper_clothing: jacket
  upper_color: yellow
  lower_clothing: pants
  lower_color: black
  height_cm: 130
  height_tolerance_cm: 10

appearance:
  similarity_threshold: 0.7
  height_pixels_per_cm: null
  model_name: openai/clip-vit-base-patch32
  analysis_interval_frames: 30

api:
  host: 127.0.0.1
  port: 8000
  data_path: data/missing_persons.json
  media_directory: data/missing_person_media
  max_upload_bytes: 10485760

security:
  api_key_env: MISSING_PERSON_API_KEY
